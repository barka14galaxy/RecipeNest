
name: Build RecipeNest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack Android project
        run: |
          mkdir -p project
          unzip -o RecipeNest-Android-Starter.zip -d project

      - name: Build APK
        run: |
          cd project/RecipeNest-Android
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RecipeNest-debug-apk
          path: project/RecipeNest-Android/app/build/outputs/apk/debug/*.apk
