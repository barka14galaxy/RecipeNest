name: Build RecipeNest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android project
        run: |
          mkdir -p project
          unzip -o RecipeNest-Android-Starter.zip -d project
          find project -maxdepth 6 -type f | sort | head -200

      - name: Build APK
        run: |
          WRAPPER="$(find project -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "The ZIP is missing the Gradle build wrapper."
            exit 1
          fi
          chmod +x "$WRAPPER"
          cd "$(dirname "$WRAPPER")"
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RecipeNest-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
